name: Android Flashcard Reader - Debug APK

on:
  push:
    branches:
      - claude/pdf-ebook-flashcard-app-glfpuk
    paths:
      - "android-flashcard-reader/**"
      - ".github/workflows/android-flashcard-reader.yml"
  workflow_dispatch: {}

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-flashcard-reader
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flashcard-reader-debug-apk
          path: android-flashcard-reader/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
