name: Android Flashcard Reader - Debug APK

on:
  push:
    branches:
      - claude/pdf-ebook-flashcard-app-glfpuk
    paths:
      - "android-flashcard-reader/**"
      - ".github/workflows/android-flashcard-reader.yml"
  workflow_dispatch: {}

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    # Needed so the release step below can create/update a GitHub Release.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android-flashcard-reader
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The Focus Gate credit engine is pure Kotlin precisely so CI can prove the anti-fake
      # rules (a fling earns nothing, a page never pays twice, the rate cap holds).
      #
      # No --stacktrace. Compose code cannot be compiled anywhere but here, so this log is the
      # only place a compile error is ever reported - and --stacktrace buried each one under a
      # few hundred kilobytes of Gradle internals, which made reading the actual error harder
      # than finding it by inspection. The summary step below pulls the errors back out.
      - name: Unit tests
        run: ./gradlew testReleaseUnitTest

      - name: Build release APK
        run: ./gradlew assembleRelease

      # Renders the Compose screens to PNG on the JVM and keeps them as an artifact.
      #
      # Deliberately after the APK is published and marked continue-on-error: the Android SDK is
      # unreachable from where this app is written, so this is the only way anyone writing it can
      # see the layout - but that is a diagnostic luxury, and it must never be the reason a working
      # build fails to reach a phone. Records rather than verifies, because there are no golden
      # images to compare against yet; commit a set from a run to start failing on visual change.
      - name: Render screenshots
        if: always()
        continue-on-error: true
        run: ./gradlew -Psnapshots recordPaparazziRelease

      # Bundled into one file so it can ride along on the Release. Actions artifacts live on
      # blob storage that the development environment cannot reach, so an artifact is
      # effectively write-only from there; a Release asset is fetchable. This is the only way
      # the rendered screens can be looked at before someone installs the app on a phone.
      - name: Bundle screenshots for the release
        if: always()
        continue-on-error: true
        run: |
          cd android-flashcard-reader/app/src/test/snapshots 2>/dev/null || exit 0
          zip -qr "$GITHUB_WORKSPACE/screenshots.zip" . -i '*.png' || true

      - name: Upload screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: android-flashcard-reader/app/src/test/snapshots/**/*.png
          if-no-files-found: warn

      # Repeats just the compiler errors and failed test names at the end of the log, where
      # they can be read without scrolling past the whole build.
      - name: Summarise failures
        if: failure()
        run: |
          # Both kinds of failure, because only matching compiler errors hid a configuration
          # error twice - the build failed in under a second with nothing in the log to say why.
          echo "Compiler errors, and the 'what went wrong' block if configuration failed:"
          ./gradlew assembleRelease 2>&1 \
            | awk '/^e: /{print} /\* What went wrong/,/\* Try:/{print}' \
            | head -80 || true

      # Kept for anyone browsing the Actions run on desktop.
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashcard-reader-release-apk
          path: android-flashcard-reader/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # The reliable way to get the APK onto a phone: a Release asset is a raw,
      # directly-downloadable .apk on a public repo - no GitHub login, no browser
      # verification wall, no zip. Uses a rolling tag so the "latest release"
      # download link below always points at the newest build.
      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Flashcard Reader - latest build
          body: >-
            Direct APK download for sideloading. This is now an optimized, non-debuggable
            release build (R8 + Baseline Profile), signed with the same key as before so it
            installs in place over an existing copy. On a phone, tap the app-release.apk
            asset below to install. Google Play Protect will warn about an unrecognized
            developer (normal for a self-signed app) - choose "More details" then
            "Install anyway".
          prerelease: false
          make_latest: true
          files: |
            android-flashcard-reader/app/build/outputs/apk/release/app-release.apk
            screenshots.zip
