name: Android Flashcard Reader - Baseline Profile

# Profile generation boots an emulator (slow), so it runs only when the profiling module
# itself changes - not on every app push. It commits the generated profile back to the branch,
# which re-triggers the normal APK build so the next release APK bakes the profile in. Can also
# be run by hand from the Actions tab.
on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/pdf-ebook-flashcard-app-glfpuk
    paths:
      - "android-flashcard-reader/baselineprofile/**"
      - ".github/workflows/android-baseline-profile.yml"

jobs:
  generate-baseline-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android-flashcard-reader
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The Android emulator needs hardware acceleration (KVM) on the runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Baseline Profile on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: android-flashcard-reader
          disable-animations: true
          script: ./gradlew :app:generateBaselineProfile --stacktrace

      - name: Commit generated profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src
          if git diff --cached --quiet; then
            echo "No baseline-profile changes to commit."
          else
            git commit -m "Generate Baseline Profile"
            git push origin HEAD:claude/pdf-ebook-flashcard-app-glfpuk
          fi
